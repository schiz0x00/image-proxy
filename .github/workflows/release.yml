name: release

on:
  push:
    # Both cases: the existing V1.0 tag would not have matched a 'v*' glob.
    tags: ['v*', 'V*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags='-s -w' -o dist/image-proxy .
            tar -czf "dist/image-proxy_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" -C dist image-proxy
            rm dist/image-proxy
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt

      # --verify-tag refuses to invent a tag if the ref is somehow absent.
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
